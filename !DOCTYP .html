<!DOCTYPE html>
<html>
<head>
  <title>Smart Water</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body { background:#0f172a; color:white; text-align:center; font-family:Arial; }
    .card { background:#1e293b; padding:20px; margin:10px; border-radius:10px; display:inline-block; width:180px;}
    .danger { color:red; }
    .safe { color:lightgreen; }
    .mode { color:cyan; }
  </style>
</head>

<body>

<h1>💧 Smart Water Dashboard</h1>

<div class="card">Flow <h2 id="flow">0</h2></div>
<div class="card">Total <h2 id="total">0</h2></div>
<div class="card">Status <h2 id="alarm">NORMAL</h2></div>
<div class="card">Mode <h2 id="mode">-</h2></div>
<div class="card">7 Hari <h2 id="weekly">0 L</h2></div>

<canvas id="chart"></canvas>

<script>

const API = "https://smartwatermeter-production.up.railway.app";
let token = "";

let chart = new Chart(document.getElementById('chart'), {
  type:'line',
  data:{labels:[], datasets:[{label:"Flow", data:[]}]}
});

function login(){
  fetch(API+"/login",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({username:"admin",password:"1234"})
  })
  .then(res=>res.json())
  .then(d=>{
    token = d.token;
    loadWeekly();
    setInterval(update,2000);
  });
}

async function update(){
  const res=await fetch(API+"/latest");
  const d=await res.json();

  flow.innerText=d.flow.toFixed(2)+" L/min";
  total.innerText=d.total.toFixed(2)+" L";

  if(d.alarm==1){
    alarm.innerText="ALARM 🚨";
    alarm.className="danger";
  }else{
    alarm.innerText="NORMAL";
    alarm.className="safe";
  }

  mode.innerText=d.source;

  chart.data.labels.push(new Date().toLocaleTimeString());
  chart.data.datasets[0].data.push(d.flow);

  if(chart.data.labels.length>20){
    chart.data.labels.shift();
    chart.data.datasets[0].data.shift();
  }

  chart.update();
}

async function loadWeekly(){
  const res=await fetch(API+"/history",{headers:{Authorization:token}});
  const data=await res.json();

  const now=new Date();
  const lastWeek=new Date();
  lastWeek.setDate(now.getDate()-7);

  let filtered=data.filter(d=>new Date(d.time)>=lastWeek);

  if(filtered.length<2){
    weekly.innerText="0 L";
    return;
  }

  let totals=filtered.map(d=>d.total);
  let usage=Math.max(...totals)-Math.min(...totals);

  weekly.innerText=usage.toFixed(2)+" L";
}

login();

</script>

</body>
</html>
